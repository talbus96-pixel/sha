<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sha icon</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div style="width: {{px}}; height: {{px}}; border-radius: {{radius}}; background: {{bg}}; box-shadow: inset 0 0 0 1px {{edge}}; overflow: hidden; display: flex">
<sc-if value="{{isShin}}" hint-placeholder-val="{{true}}">
<svg viewBox="0 0 100 100" width="100%" height="100%" role="img" aria-label="Sha logo: the letter shin with a dot">
<path d="M29 34 V58 Q29 73 44 73 H56 Q71 73 71 58 V34" fill="none" stroke="{{stroke}}" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"></path>
<path d="M50 42 V73" fill="none" stroke="{{stroke}}" stroke-width="7" stroke-linecap="round"></path>
<circle cx="71" cy="20" r="6.5" fill="{{dot}}"></circle>
</svg>
</sc-if>
<sc-if value="{{isBox}}" hint-placeholder-val="{{false}}">
<svg viewBox="0 0 100 100" width="100%" height="100%" role="img" aria-label="Sha logo: a square with a dot moving along it">
<rect x="25" y="25" width="50" height="50" rx="7" fill="none" stroke="{{stroke}}" stroke-width="6.5"></rect>
<circle cx="35" cy="25" r="2.6" fill="{{dot}}" opacity="0.35"></circle>
<circle cx="43" cy="25" r="3.8" fill="{{dot}}" opacity="0.6"></circle>
<circle cx="54" cy="25" r="6.5" fill="{{dot}}"></circle>
</svg>
</sc-if>
<sc-if value="{{isThree}}" hint-placeholder-val="{{false}}">
<svg viewBox="0 0 100 100" width="100%" height="100%" role="img" aria-label="Sha logo: three rising strokes, like three breaths">
<path d="M30 72 C 27 58 25 46 28 36" fill="none" stroke="{{stroke}}" stroke-width="6.5" stroke-linecap="round"></path>
<path d="M50 72 V 48" fill="none" stroke="{{stroke}}" stroke-width="6.5" stroke-linecap="round"></path>
<path d="M70 72 C 73 57 74 42 70 28" fill="none" stroke="{{stroke}}" stroke-width="6.5" stroke-linecap="round"></path>
<path d="M30 72 Q 50 80 70 72" fill="none" stroke="{{stroke}}" stroke-width="6.5" stroke-linecap="round"></path>
<circle cx="69" cy="17" r="6" fill="{{dot}}"></circle>
</svg>
</sc-if>
<sc-if value="{{isEnso}}" hint-placeholder-val="{{false}}">
<svg viewBox="0 0 100 100" width="100%" height="100%" role="img" aria-label="Sha logo: an open circle with a dot in the gap">
<path d="M 50 22 A 28 28 0 1 1 30.2 30.2" fill="none" stroke="{{stroke}}" stroke-width="7.5" stroke-linecap="round"></path>
<circle cx="39.5" cy="24.5" r="5.5" fill="{{dot}}"></circle>
</svg>
</sc-if>
<sc-if value="{{isWave}}" hint-placeholder-val="{{false}}">
<svg viewBox="0 0 100 100" width="100%" height="100%" role="img" aria-label="Sha logo: one breath as a wave with a dot on top">
<path d="M16 64 C 30 64 34 36 50 36 S 70 64 84 64" fill="none" stroke="{{stroke}}" stroke-width="6.5" stroke-linecap="round"></path>
<circle cx="50" cy="36" r="7" fill="{{dot}}"></circle>
</svg>
</sc-if>
<sc-if value="{{isLamb}}" hint-placeholder-val="{{false}}">
<svg viewBox="0 0 100 100" width="100%" height="100%" role="img" aria-label="Sha logo: a calm little lamb">
<circle cx="36" cy="38" r="11" fill="{{soft}}"></circle>
<circle cx="50" cy="32" r="12" fill="{{soft}}"></circle>
<circle cx="64" cy="38" r="11" fill="{{soft}}"></circle>
<circle cx="30" cy="51" r="9" fill="{{soft}}"></circle>
<circle cx="70" cy="51" r="9" fill="{{soft}}"></circle>
<ellipse cx="31" cy="54" rx="9" ry="4.5" fill="{{stroke}}" transform="rotate(-22 31 54)"></ellipse>
<ellipse cx="69" cy="54" rx="9" ry="4.5" fill="{{stroke}}" transform="rotate(22 69 54)"></ellipse>
<ellipse cx="50" cy="58" rx="14" ry="17" fill="{{stroke}}"></ellipse>
<circle cx="44.5" cy="55" r="2.4" fill="{{bg}}"></circle>
<circle cx="55.5" cy="55" r="2.4" fill="{{bg}}"></circle>
<circle cx="50" cy="66" r="3.2" fill="{{dot}}"></circle>
</svg>
</sc-if>
<sc-if value="{{isFlow}}" hint-placeholder-val="{{false}}">
<svg viewBox="0 0 100 100" width="100%" height="100%" role="img" aria-label="Sha logo: a flowing S like a slow breath">
<path d="M66 31 C 58 22 34 23 34 37 C 34 51 66 47 66 62 C 66 76 43 78 34 70" fill="none" stroke="{{stroke}}" stroke-width="7" stroke-linecap="round"></path>
<circle cx="66" cy="31" r="6.5" fill="{{dot}}"></circle>
</svg>
</sc-if>
<sc-if value="{{isTri}}" hint-placeholder-val="{{false}}">
<svg viewBox="0 0 100 100" width="100%" height="100%" role="img" aria-label="Sha logo: a triangle with a dot moving along it">
<path d="M28 72 V28 H74 Z" fill="none" stroke="{{stroke}}" stroke-width="6.5" stroke-linejoin="round"></path>
<circle cx="48" cy="28" r="6.5" fill="{{dot}}"></circle>
</svg>
</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"kind":{"editor":"enum","default":"shin","options":["shin","box","three","enso","wave","lamb","flow","tri"]},"stroke":{"editor":"color","default":"#4b7fd6"},"dot":{"editor":"color","default":"#e76f51"},"bg":{"editor":"color","default":"#ffffff"},"size":{"editor":"int","default":220,"min":16,"max":512},"$preview":{"width":220,"height":220}}'>
class Component extends DCLogic {
renderVals() {
const p = this.props;
const size = Number(p.size) || 220;
const kind = p.kind || 'shin';
const bg = p.bg || '#ffffff';
const stroke = p.stroke || '#4b7fd6';
const rgb = hex => {
const n = parseInt(String(hex).replace('#', ''), 16) || 0;
return [n >> 16, (n >> 8) & 255, n & 255];
};
const [r, g, b] = rgb(bg);
const dark = r * 0.299 + g * 0.587 + b * 0.114 < 128;
const [sr, sg, sb] = rgb(stroke);
return {
px: size + 'px',
radius: Math.round(size * 0.225) + 'px',
bg,
stroke,
dot: p.dot || '#e76f51',
edge: dark ? 'transparent' : 'rgba(39, 48, 61, 0.10)',
soft: 'rgba(' + sr + ', ' + sg + ', ' + sb + ', ' + (dark ? 0.35 : 0.2) + ')',
isShin: kind === 'shin',
isBox: kind === 'box',
isThree: kind === 'three',
isEnso: kind === 'enso',
isWave: kind === 'wave',
isLamb: kind === 'lamb',
isFlow: kind === 'flow',
isTri: kind === 'tri'
};
}
}
</script>
</body>
</html>
