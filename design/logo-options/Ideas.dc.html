<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":880,"height":1160}}'>
class Component extends DCLogic {
renderVals() {
const cx = 256, cy = 256;
// a point at angle deg (0 = top, clockwise) and radius r
const at = (deg, r) => {
const a = deg * Math.PI / 180;
return [(cx + r * Math.sin(a)).toFixed(1), (cy - r * Math.cos(a)).toFixed(1)];
};
const arc = (a0, a1, r) => {
const p0 = at(a0, r), p1 = at(a1, r);
const large = a1 - a0 > 180 ? 1 : 0;
return 'M' + p0[0] + ' ' + p0[1] + ' A' + r + ' ' + r + ' 0 ' + large + ' 1 ' + p1[0] + ' ' + p1[1] + ' ';
};
let wavy = '';
for (let d = 0; d <= 360; d += 3) {
const p = at(d, 168 + 9 * Math.sin(d * 8 * Math.PI / 180));
wavy += (d === 0 ? 'M' : 'L') + p[0] + ' ' + p[1] + ' ';
}
let ticks = '';
for (let i = 1; i < 12; i++) {
const len = i % 3 === 0 ? 26 : 12;
const p0 = at(i * 30, 184), p1 = at(i * 30, 184 + len);
ticks += 'M' + p0[0] + ' ' + p0[1] + ' L' + p1[0] + ' ' + p1[1] + ' ';
}
return {
wavy: wavy + 'Z',
arcsA: arc(8, 82, 168) + arc(188, 262, 168),
arcsB: arc(98, 172, 168) + arc(278, 352, 168),
ticks: ticks,
floatRing: arc(12, 348, 168)
};
}
}
</script>
