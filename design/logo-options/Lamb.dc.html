<x-dc>

<span lang="ru" style="font-size: 48px; font-weight: 500; letter-spacing: 0.02em">Ша</span>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#7d63c8","options":["#7d63c8","#4b7fd6","#3f9a6b","#e8735a"]},"dot":{"editor":"color","default":"#f0953f","options":["#f0953f","#e76f51","#c9405c","#1f9aa8"]},"$preview":{"width":880,"height":560}}'>

renderVals() {
return { accent: this.props.accent ?? '#7d63c8', dot: this.props.dot ?? '#f0953f' };
}
}
</script>
